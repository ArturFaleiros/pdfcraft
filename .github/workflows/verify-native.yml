name: Consolidated native import and redaction validation

on:
  push:
    branches: [chore/verify-consolidated-office]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 4


concurrency:
  group: validate-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
      - name: Reproduce the reviewed merge and generate attribution
        id: source
        shell: bash
        run: |
          cp .github/validation/consolidation.patch "$RUNNER_TEMP/consolidation.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach e372b78be727991683e510a0d6ab15ad5fe0e1d5
          git remote add upstream https://github.com/storytold/pdfcraft.git
          git fetch upstream afa8e1843cfed613f3d403119f6c2649bce824c9
          git update-ref refs/remotes/upstream/main afa8e1843cfed613f3d403119f6c2649bce824c9
          git merge --no-commit --no-ff upstream/main || test -f .git/MERGE_HEAD
          git apply "$RUNNER_TEMP/consolidation.patch"
          git add -u
          test "$(git write-tree)" = 01224f34ae220b3ea28e0e3889feacbfa97a8d9c
          cargo xtask assets --write
          cargo fmt --all -- --check
          git add ATTRIBUTION.md
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
          git commit -m 'M10/M8: isolated validation candidate preserving native import and JPEG redaction'
          git push origin HEAD:refs/heads/chore/native-office-candidate
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  test:
    needs: prepare
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        # No macOS on PRs, main or nightly: the org's 5 macOS slots are kept for release builds,
        # and release.yml builds macOS (a failing release is fixed and rebuilt).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # The optional craft-fonts build input (Japanese fonts), so the Japanese font tests run on
      # Linux; Windows tests the build without it. See craftrules standards/fonts.md.
      - name: Check out craft-fonts (Linux)
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts

      - name: Configure craft-fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"
          echo "PDFCRAFT_ORACLES_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies (egui/winit/rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers poppler-utils qpdf libreoffice

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install fixture font (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.local/share/fonts
          cp assets/fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f
      - name: Require Windows executable resources
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_ENV -Value 'PDFCRAFT_REQUIRE_WINRES=1'
        shell: pwsh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Format
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          git diff > formatting.patch

      - name: Compile CLI for end-to-end checks
        run: cargo build --locked -p pdfcraft-cli
      - name: Install independent PDF checkers
        run: python -m pip install pypdf Pillow python-docx python-pptx openpyxl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: target/validation-harness
      - name: CLI save-reopen and independent image/text verification
        shell: bash
        run: python target/validation-harness/.github/validation/e2e.py target/debug/pdfcraft-cli${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Native Office conversion tool integration
        run: cargo test --locked -p pdfcraft-automation creating_pdfs_from_word_and_powerpoint_natively
      - name: Native Word conversion in the real UI
        run: cargo test --locked -p pdfcraft-ui-egui --lib a_chosen_tool_runs_on_a_converted_word_file_only_after_native_preparation_commits
      - name: Render converted Word in the real app shell
        if: runner.os == 'Linux'
        env:
          XDG_RUNTIME_DIR: /tmp
          PDFCRAFT_SYSTEM_FONTS: 0
        run: cargo run -p pdfcraft-ui-egui --example shot -- target/validation-output/app-office.png target/validation-output/converted-docx.pdf --scale 1 --language en
      - name: Render the real app shell with the redacted PDF
        if: runner.os == 'Linux'
        env:
          XDG_RUNTIME_DIR: /tmp
          PDFCRAFT_SYSTEM_FONTS: 0
        run: cargo run -p pdfcraft-ui-egui --example shot -- target/validation-output/app-redacted.png target/validation-output/jpg-after.pdf --scale 1 --language en
      - name: Render PDF independently with Poppler
        if: runner.os == 'Linux'
        run: pdftoppm -r 72 -png -singlefile target/validation-output/jpg-after.pdf target/validation-output/poppler-redacted
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: cargo test --locked --workspace --no-fail-fast

      - name: Test (with craft-fonts)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo test --locked --workspace --no-fail-fast

      - name: Layering
        if: runner.os == 'Linux'
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        if: runner.os == 'Linux'
        run: cargo xtask assets

      - name: CLI without the MCP server still builds
        if: runner.os == 'Linux'
        run: cargo check -p pdfcraft-cli --no-default-features

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: validation-${{ runner.os }}
          path: |
            target/validation-output
            formatting.patch
          if-no-files-found: ignore

  wasm:
    needs: prepare
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32
      - name: Check library crates for wasm32
        run: cargo xtask wasm

  deny:
    needs: prepare
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
