name: Office and redaction validation

on:
  push:
    branches: [chore/verify-office-conversion]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 4


concurrency:
  group: validate-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        # No macOS on PRs, main or nightly: the org's 5 macOS slots are kept for release builds,
        # and release.yml builds macOS (a failing release is fixed and rebuilt).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The optional craft-fonts build input (Japanese fonts), so the Japanese font tests run on
      # Linux; Windows tests the build without it. See craftrules standards/fonts.md.
      - name: Check out craft-fonts (Linux)
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts

      - name: Configure craft-fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"
          echo "PDFCRAFT_ORACLES_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies (egui/winit/rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers poppler-utils qpdf libreoffice

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress
      - name: Install fixture font (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.local/share/fonts
          cp assets/fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f
      - name: Require Windows executable resources
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_ENV -Value 'PDFCRAFT_REQUIRE_WINRES=1'
        shell: pwsh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Format
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          git diff > formatting.patch

      - name: Compile CLI for end-to-end checks
        run: cargo build --locked -p pdfcraft-cli
      - name: Install independent PDF checkers
        run: python -m pip install pypdf Pillow python-docx python-pptx openpyxl
      - name: CLI save-reopen and independent image/text verification
        shell: bash
        run: python .github/validation/e2e.py target/debug/pdfcraft-cli${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Office conversion tool integration
        shell: bash
        run: |
          export PDFCRAFT_OFFICE_TEST_INPUT="$GITHUB_WORKSPACE/target/validation-output/office.docx"
          cargo test -p pdfcraft-automation office_conversion_opens_a_new_unsaved_pdf -- --ignored
      - name: Office conversion in the real UI
        if: runner.os == 'Linux'
        shell: bash
        env:
          XDG_RUNTIME_DIR: /tmp
          PDFCRAFT_SYSTEM_FONTS: 0
        run: |
          export PDFCRAFT_OFFICE_TEST_INPUT="$GITHUB_WORKSPACE/target/validation-output/office.docx"
          export PDFCRAFT_OFFICE_TEST_SHOT="$GITHUB_WORKSPACE/target/validation-output/app-office.png"
          cargo test -p pdfcraft-ui-egui --lib office_open_converts_in_background_without_replacing_the_source -- --ignored
      - name: Render the real app shell with the redacted PDF
        if: runner.os == 'Linux'
        env:
          XDG_RUNTIME_DIR: /tmp
          PDFCRAFT_SYSTEM_FONTS: 0
        run: cargo run -p pdfcraft-ui-egui --example shot -- target/validation-output/app-redacted.png target/validation-output/jpg-after.pdf --scale 1 --language en
      - name: Render PDF independently with Poppler
        if: runner.os == 'Linux'
        run: pdftoppm -r 72 -png -singlefile target/validation-output/jpg-after.pdf target/validation-output/poppler-redacted
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: cargo test --locked --workspace --no-fail-fast

      - name: Test (with craft-fonts)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo test --locked --workspace --no-fail-fast

      - name: Layering
        if: runner.os == 'Linux'
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        if: runner.os == 'Linux'
        run: cargo xtask assets

      - name: CLI without the MCP server still builds
        if: runner.os == 'Linux'
        run: cargo check -p pdfcraft-cli --no-default-features

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: validation-${{ runner.os }}
          path: |
            target/validation-output
            formatting.patch
          if-no-files-found: ignore

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasm32
      - name: Check library crates for wasm32
        run: cargo xtask wasm

  deny:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
